# Composite setup shared by every CI job that needs the toolchain (#256).
# `voidzero-dev/setup-vp` installs Vite+ at the catalog's `vite-plus` pin
# (auto-detected from pnpm-workspace.yaml) and, through it, Node.js and the
# pnpm that `packageManager` names, then restores the dependency cache (keyed
# on pnpm-lock.yaml). Its own install is off: the step below installs with a
# frozen lockfile and retries (see its comment for why). `vp`, `pnpm` and the
# managed `node` are on PATH for later steps; the dev bins (tsc, tsx, fallow)
# land in node_modules/.bin and are reached through `pnpm exec`, rather than
# this action writing `GITHUB_PATH`, an environment-file write zizmor flags as
# a step-to-step injection channel.
# Copied from the effect-web library's action (itself from effect-drizzle-ext
# and the gardeneria application), with a `node-version` input (as in
# effect-ai-ext's copy) so the `node-floor` job can reuse it (#181).
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+, Node.js and pnpm, restore the package cache, and install dependencies.
inputs:
  node-version:
    description: >-
      The Node.js version to install (`vp env use` syntax). Empty: Vite+
      resolves it from the root package.json's `engines.node`.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        run-install: false

    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build — a transient ENOENT on the
    # rename of a `_tmp_<pid>_<hex>` staging directory, seen in gardeneria CI
    # on cold-store runs (see effect-drizzle-ext's copy of this action). Every
    # attempt keeps `--frozen-lockfile` and install scripts, so a
    # deterministic failure (lockfile drift, a policy violation) still fails
    # all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
