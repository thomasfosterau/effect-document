name: Release

on:
  push:
    branches:
      - main

# Avoid overlapping release runs.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Provides node + npm and writes an .npmrc wired to NODE_AUTH_TOKEN,
      # which `changeset publish` (it shells out to `npm publish`) needs.
      - name: Setup Node for npm publish auth
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On a push to main:
      #  - if changesets exist, opens/updates a "Version Packages" PR
      #    (runs `bun run version`); merging that PR triggers a publish run
      #  - if a release commit just landed, publishes via `bun run release`
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
