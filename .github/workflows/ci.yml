name: CI

# ONE required job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check`, `check:dist`, `test:integration` and
# `examples` tasks and every package's `test:unit` / `build`), not in GitHub
# Actions `needs:`. Copied in shape from the effect-web library: nothing here
# needs a database, a stage or a credential, so every PR class runs the whole
# gate.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Format and lint
        run: vp check
      - name: Type gates (src + tests + examples)
        run: vp run --concurrency-limit 2 check
      - name: Unit tests
        run: vp run -r test:unit
      - name: Integration tests (cross-format conversions)
        run: vp run test:integration
      # Public corpora pinned in corpora.json (#133): fetched, never
      # committed, and cached by their pins.
      - name: Restore the corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpora
          key: corpora-v1-${{ hashFiles('corpora.json') }}
      - name: Fetch the pinned corpora
        run: vp run corpora:fetch
      # Writer output checked by independent tools (#134): every OOXML part
      # against the ECMA-376 schemas (fetched above as a corpus).
      - name: Validate writer output (xmllint, ECMA-376)
        run: |
          command -v xmllint || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libxml2-utils; }
          vp run test:validate
      # Every reader over every corpus file: no defects, no hangs.
      - name: Corpus smoke tests
        run: vp run test:corpus
      - name: Corpus read rates
        if: always()
        run: |
          if [ -f .corpora/report.json ]; then
            {
              echo '### Corpus read rates'
              echo '```json'
              node -e 'console.log(JSON.stringify(require("./.corpora/report.json").formats, null, 2))'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: vp run -r build
      - name: Dist import guard (no effect/unstable)
        run: vp run check:dist
      # Runs every program under examples/ against the built dist/.
      - name: Run the examples
        run: vp run examples
      # Packs every package, lints the tarballs (publint, attw) and imports
      # and type-checks them from a scratch consumer project.
      - name: Packed-package smoke test
        run: vp run check:pack
      - name: Audit
        run: pnpm audit --audit-level high

  # Optional, not a required check (#134): our writers' output opened by
  # independent tools. LibreOffice converts every DOCX, XLSX, PPTX and RTF
  # feature sample to PDF, qpdf and pdftotext check the PDF samples, and
  # pandoc reads the DOCX ones. INTEROP=1 makes a missing tool a failure.
  interop:
    runs-on: ubuntu-latest
    # The first, uncached install of LibreOffice can be slow on the runners'
    # apt mirror (a 20-minute limit ran out mid-download); later runs restore
    # the packages from the cache below.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      INTEROP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The downloaded .deb files, keyed by this workflow (which names the
      # packages), so a rerun installs without fetching ~150 MB again.
      - name: Restore the apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: interop-apt-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            interop-apt-v1-${{ runner.os }}-
      - name: Install LibreOffice, qpdf, poppler and pandoc
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" \
            libreoffice-writer libreoffice-calc libreoffice-impress qpdf poppler-utils pandoc
          # apt writes the cache as root; the cache action saves it as the runner user
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Interop tests
        run: vp run test:interop
