name: CI

# One workflow, one command: `vp run ci`, the task in vite.config.ts that runs
# the whole gate in order (format and lint, types, unit and integration tests,
# the corpora and writer validation, the build, the dist and pack checks, the
# examples, the audit), so a local `vp run ci` is exactly what runs here.
#
# It runs on the current LTS and the latest released Node (`test`, a matrix
# that never cancels its siblings), and `ci` is the one stable check for
# rulesets: it passes only when every matrix leg did. Both lines are inside
# `engines.node` (`>=22`).
#
# The suites run in a zone west of UTC, so nothing may read the host's zone:
# the runners are UTC, and every OOXML write once failed west of it (#117).

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job grants only read access.
permissions: {}

jobs:
  test:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      TZ: America/Los_Angeles
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ at the catalog's vite-plus pin (read from pnpm-workspace.yaml),
      # the matrix's Node.js, and the pnpm cache keyed on pnpm-lock.yaml.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: false
      # Public corpora pinned in corpora.json (#133): fetched by `vp run ci`,
      # never committed, and cached by their pins.
      - name: Restore the corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpora
          key: corpora-v1-${{ hashFiles('corpora.json') }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: CI
        run: vp run ci

  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every Node passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
