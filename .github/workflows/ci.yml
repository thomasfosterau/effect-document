name: CI

# One command, `vp run ci` (vite.config.ts), so a local run is the same
# pipeline. The `lts` leg also installs the interop tools and sets INTEROP=1.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # An uncached LibreOffice install can be slow.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # West of UTC, so nothing may depend on the host's time zone.
      TZ: America/Los_Angeles
      INTEROP: ${{ matrix.node == 'lts' && '1' || '0' }}
      # Inherited by every child process, vitest forks included.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - name: Restore the corpus cache
        uses: actions/cache@v6.1.0
        with:
          path: .corpora
          key: corpora-v1-${{ hashFiles('corpora.json') }}
      - name: Restore the apt package cache
        if: matrix.node == 'lts'
        uses: actions/cache@v6.1.0
        with:
          path: ~/apt-cache
          key: interop-apt-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            interop-apt-v1-${{ runner.os }}-
      # xmllint for `test:validate`; on `lts`, the tools `test:interop` drives.
      - name: Install system tools
        env:
          WITH_INTEROP: ${{ matrix.node == 'lts' }}
        run: |
          packages="libxml2-utils"
          if [ "$WITH_INTEROP" = true ]; then
            packages="$packages libreoffice-writer libreoffice-calc libreoffice-impress qpdf poppler-utils pandoc"
          fi
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -q
          # shellcheck disable=SC2086 # the package list is split on purpose
          sudo apt-get install -yq --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" $packages
          # apt writes the cache as root; the cache action saves it as the runner user
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: CI
        run: vp run ci

  # Not part of the required `ci` checks.
  devcontainer:
    name: devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          run-install: false
      - name: Build and start the container
        run: vp dlx @devcontainers/cli@0.89.0 up --workspace-folder .
      - name: Check Vite+ in the container
        run: vp dlx @devcontainers/cli@0.89.0 exec --workspace-folder . vp --version
