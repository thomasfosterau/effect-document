# Dependabot version updates.
#
# Groups collect dependencies that MUST move together, so a lockstep set
# arrives as one PR instead of several that each go red alone. Dependabot puts
# a dependency in the FIRST group that matches it, so the groups run from
# specific to general:
#
# - `toolchain`: `vite-plus` pins `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` exactly (the `vite` / `vitest` catalog entries and
#   `@vitest/coverage-istanbul` must equal its pins), and `effect-tsgo patch`
#   (the `prepare` script) matches the native `tsc` (`@typescript/native`)
#   and `oxlint` by gitHead / version, hard-erroring on any pairing it has no
#   artifact for. The TS6 JS compiler (`typescript`, an alias of
#   `@typescript/typescript6`) and the Effect oxlint rules
#   (`@enfect/oxlint`), which run inside that oxlint, move with them. Read
#   the `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
#   before merging.
# - `effect`: the Effect 4 line is a lockstep-versioned singleton set
#   (`@effect/platform-node` peers on the exact `effect` version);
#   `@effect/tsgo` belongs to the toolchain instead.
# - `zip`: `fflate` is the ZIP / DEFLATE codec the OOXML, iWork and PDF
#   packages share; `parse`: `@thomasfosterau/effect-parse` is the combinator
#   library the CSV, OOXML, iWork and RTF readers are written against. One
#   version of each across the packages.
# - `example-runner` (`tsx`, plus `@effect/docgen` should it be added),
#   `changesets`, `fallow`, `pack-lint` (`publint` and
#   `@arethetypeswrong/cli`, the `check:pack` tarball linters): tooling that
#   moves as a unit.
# - `minor-and-patch`: everything else, minor and patch only; a major of an
#   ungrouped dependency arrives on its own.
#
# Moved by hand, on the matching group's PR (Dependabot cannot do these):
# - the npm-alias catalog entries: `vite`
#   (`npm:@voidzero-dev/vite-plus-core@<v>`, must equal `vite-plus`; or run
#   `pnpm dlx --package=vite-plus@<v> vp migrate --no-interactive` and drop
#   the `minimumReleaseAgeExclude` entries it adds), `typescript`
#   (`npm:@typescript/typescript6@<v>`) and `@typescript/native`
#   (`npm:typescript@<v>`, matching `@effect/tsgo`'s `components` table);
# - `vitest` / `@vitest/coverage-istanbul`, to the exact vitest the new
#   `vite-plus` pins;
# - an `@effect/tsgo` release that supports the new vite-plus's oxlint and
#   oxlint-tsgolint, when the toolchain PR goes red at install;
# - the published peer range (`catalogs.peers.effect`), a breaking change.
#
# `cooldown` is 1 day, Dependabot's smallest unit; pnpm-workspace.yaml's
# `minimumReleaseAge` is 8 hours (480 minutes). The cooldown is the longer of
# the two, so a Dependabot PR never proposes a version pnpm would still
# refuse. The first-party `@thomasfosterau/*` packages are exempt in both.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      zip:
        applies-to: version-updates
        patterns:
          - "fflate"
        update-types: ["major", "minor", "patch"]
      parse:
        applies-to: version-updates
        patterns:
          - "@thomasfosterau/effect-parse"
        update-types: ["major", "minor", "patch"]
      example-runner:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      pack-lint:
        applies-to: version-updates
        patterns:
          - "publint"
          - "@arethetypeswrong/*"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
