# Every external version lives in the catalog (`catalogMode: strict`); after
# editing it, run `vp install` and commit pnpm-lock.yaml.
packages:
  - packages/*
  # Private: the README's runnable examples (`vp run examples`).
  - examples
  # Private: the benchmarks against other libraries (`vp run bench`).
  - bench

catalogMode: strict

catalog:
  "@effect/docgen": ^4.1.4
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch` (the `prepare` script) supports only the oxlint,
  # tsgolint and native `tsc` versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs; move them together.
  "@effect/tsgo": 0.69.0
  # Dev-only; exact, in lockstep with `effect`.
  "@effect/platform-node": 4.1.4
  "@effect/vitest": 4.1.4
  "@arethetypeswrong/cli": ^0.18.5
  "@enfect/oxlint": ^0.10.0
  # For `./encoding` only (effect-ext's `/Encoding`, which imports only `effect`).
  "@thomasfosterau/effect-ext": ^0.3.1
  # The parser combinators; consumers get it as an optional peer (below).
  "@thomasfosterau/effect-parse": ^0.6.1
  "@types/node": ^26.6.6
  # Benchmark baselines (bench/ only): maintained libraries, each released
  # within the last two years.
  "@types/d3-dsv": ^3.0.7
  "@types/papaparse": ^5.5.2
  "@types/pdfkit": ^0.17.7
  csv-parse: ^7.0.3
  csv-stringify: ^6.9.0
  d3-dsv: ^3.0.1
  docx: ^9.15.4
  exceljs: ^4.4.0
  mammoth: ^1.12.0
  papaparse: ^5.7.1
  pdfjs-dist: ^6.5.0
  # the most used maintained PDF writer (pdf-lib was last published in 2021)
  pdfkit: ^0.20.2
  pptxgenjs: ^4.0.1
  read-excel-file: ^9.3.17
  udsv: ^0.7.3
  write-excel-file: ^4.1.1
  # Must equal the vitest vite-plus pins.
  "@vitest/coverage-istanbul": 5.1.0
  effect: 4.1.4
  fallow: 3.43.2
  fflate: ^0.8.2
  publint: ^0.3.25
  # TypeScript 6 (the JS API, for the language service and declaration
  # bundling) beside TypeScript 7 (native `tsc`, patched by @effect/tsgo).
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` is vite-plus's aliased core and must equal `vite-plus`.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0

# The ranges the published package declares.
catalogs:
  peers:
    # Optional: reached only from `/csv`, `/rtf`, `/ooxml*` and `/iwork*`.
    "@thomasfosterau/effect-parse": ^0.6.1
    effect: ^4.0.0

overrides:
  # One copy of `effect`; two break Context / Layer / Schema identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # bench/ only: PptxGenJS pins a vulnerable image-size the benchmarks never reach.
  pptxgenjs>image-size: ^2.0.4
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]
skills:
  dirs: [.claude/skills]
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Hold new versions for 24 hours (minutes); Dependabot's cooldown matches it.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
