# pnpm workspace — the published packages of the effect-document family,
# plus the private examples package.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:^` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions follow the effect-web library family's catalog wherever the two
# overlap (effect, vite-plus, the TypeScript 6/7 pair, @effect/tsgo, the
# Effect oxlint plugin, fallow).
packages:
  - packages/*
  # Private: the README's runnable examples (`vp run examples`).
  - examples

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.63.0 ships against typescript 7.0.2)
  # and with the `oxlint` and `oxlint-tsgolint` that `vite-plus` pulls in
  # (0.63.0 supports oxlint 1.88.0 – 1.90.0 and tsgolint 7.0.2004 / 7.0.2005;
  # vite-plus 1.4.0 carries oxlint 1.89.0 and tsgolint 7.0.2004).
  # Each @effect/tsgo release hard-errors (UnsupportedTargetPackageVersionError)
  # on any other component version, failing `pnpm install` itself. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.63.0
  # The Node `FileSystem` / `Path` layers the test suites and the runnable
  # examples read fixtures and write output through (dev-only: no published
  # package imports it). Exact, in lockstep with `effect` below: its own peer
  # is `effect: ^<its version>`.
  "@effect/platform-node": 4.1.0
  # Lint the packed tarballs (`vp run check:pack`): publint checks the
  # manifest and `exports` against the files, and attw resolves every entry's
  # types the way consumers' module resolution does.
  "@arethetypeswrong/cli": ^0.18.5
  # The Effect oxlint rules (`effect/*`, the anti-slop set included), loaded
  # by `vp lint` as a JS plugin (`configs.recommended` in vite.config.ts).
  # 0.9.0 depends on `effect` 4.1.0 (exact) but runs on the workspace
  # singleton (the `effect` override below), so it needs no scoped override.
  # Its `vite.config.ts` load calls Effect APIs, so an `effect` bump re-runs
  # `vp check` against the plugin too. Moves with the toolchain group.
  "@enfect/oxlint": ^0.9.0
  # The combinator library the CSV, iWork, OOXML and RTF readers are written
  # against (first-party; exempt from the release-age hold below).
  "@thomasfosterau/effect-parse": ^0.3.0
  "@types/node": ^26.6.5
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.1.0
  fallow: 3.37.0
  # ZIP (OOXML, iWork bundles) and DEFLATE (PDF `/FlateDecode`).
  fflate: ^0.8.2
  publint: ^0.3.25
  # Runs the examples under `examples/`.
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler) stay on TS6 while native `tsc` type-checks. The alias
  # keeps the package importable as `typescript` name-stable at the TS6 JS
  # compiler (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned
  # exact: @typescript/native's gitHead must match @effect/tsgo's bundled
  # binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.4.0 carries oxlint 1.89.0,
  # oxfmt 0.74.0 and vitest 5.0.5. `vite` is the same release under its aliased core
  # package, and `vitest` must match vite-plus's exact pin because the
  # `vitest: "catalog:"` override forces every resolution to the catalog
  # singleton.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Ranges the PUBLISHED packages declare. Kept as a named catalog so the strict
# catalog mode still governs them while they stay ranges. `pnpm publish`
# replaces `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    # rc.118 moved every `effect/unstable/*` export path; the family's floor.
    effect: ">=4.0.0-rc.118"

overrides:
  # `vp migrate` writes the Vite+ managed overrides as `vite@*` / `vitest@*`:
  # every resolution of either goes to the catalog singleton.
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 8 hours (unit: MINUTES) before pnpm will install them.
# Dependabot's `cooldown` (1 day, its smallest unit) is longer, so it never
# proposes a version pnpm would still refuse. `vp migrate` adds the toolchain
# packages to the exclusions below; drop them again so the wait covers them.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
